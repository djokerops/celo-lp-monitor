name: LP range monitor

on:
  # Scheduling is outsourced to cron-job.org, which POSTs to the
  # workflow_dispatch API hourly. GitHub's own `schedule:` trigger is
  # deliberately absent: it is delayed under load and auto-disabled after
  # 60 days of repo inactivity.
  workflow_dispatch:       # external trigger + manual "Run workflow"
    inputs:
      force_digest:
        description: "Publish a digest now, ignoring the once-a-day gate"
        type: boolean
        default: false

permissions:
  contents: write          # needed to commit status.md/state.json back

concurrency:
  group: lp-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      # Runs every hour like the rest of the check. Reading Dune's cached results
      # is free, and the file is only rewritten when the pool set actually changes,
      # so hourly freshness does not mean hourly commits. A paid execution still
      # happens at most once a day, and never before REFRESH_MIN_UTC_HOUR.
      - name: Refresh TVL allowlist (daily, via Dune)
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          DUNE_TVL_THRESHOLD: "100"
        run: node refresh_allowlist.mjs

      # Pool-wide health (Dexscreener). Never fails the job; check.mjs reads its
      # output if present and simply omits the section if it is not.
      - name: Pool health check
        run: node pool_health.mjs

      # Publishes at most once a day (the DIGEST_UTC_HOUR digest) plus whenever a
      # flag appears or clears. Quiet runs leave status.md untouched, so the steps
      # below see no diff and nothing is committed or posted.
      - name: Run out-of-range check
        env:
          DIGEST_UTC_HOUR: "11"
          FORCE_DIGEST: ${{ github.event.inputs.force_digest == 'true' && '1' || '0' }}
        run: node check.mjs

      # check.mjs is the authority on whether we published; CI must not re-derive it.
      - name: Read the publish decision
        id: sig
        run: |
          node -e 'const s=require("./run_signal.json");console.log("publish="+s.publish);console.log("reasons="+(s.reasons||[]).join("; "))' >> "$GITHUB_OUTPUT"
          node -e 'const s=require("./run_signal.json");console.log(`publish=${s.publish} digest=${s.digest} reasons=${(s.reasons||[]).join("; ")||"none"}`)'

      - name: Detect what to commit
        id: diff
        run: |
          # tvl_history.json does not exist until the first pool-health run, and a
          # missing pathspec would fail this step and with it the whole monitor.
          for f in status.md state.json alerts.log pools_allowlist.json tvl_history.json; do
            [ -f "$f" ] || continue
            git add "$f"
          done
          # state.json changes if and only if check.mjs decided to publish, so its
          # diff is both the commit trigger and the Slack trigger.
          changed=false; allow=false; hist=false
          # status.md is only ever rewritten on a publish, so its diff belongs here
          git diff --cached --quiet -- state.json status.md alerts.log || changed=true
          git diff --cached --quiet -- pools_allowlist.json || allow=true
          git diff --cached --quiet -- tvl_history.json || hist=true
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "allow=$allow" >> "$GITHUB_OUTPUT"
          echo "hist=$hist" >> "$GITHUB_OUTPUT"
          echo "report changed: $changed | allowlist changed: $allow | daily TVL sample: $hist"

      - name: Commit back (on publish, allowlist refresh or daily TVL sample)
        if: steps.diff.outputs.changed == 'true' || steps.diff.outputs.allow == 'true' || steps.diff.outputs.hist == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          msg=""
          [ "${{ steps.diff.outputs.changed }}" = "true" ] && msg="status update"
          [ "${{ steps.diff.outputs.allow }}" = "true" ] && msg="${msg:+$msg + }allowlist refresh"
          [ "${{ steps.diff.outputs.hist }}" = "true" ] && msg="${msg:+$msg + }daily TVL sample"
          git commit -m "${msg:-status update} $(date -u +%FT%TZ) [skip ci]"
          git push

      # Only a publish pings Slack: the daily digest, or a flag appearing/clearing.
      # A TVL sample or an allowlist refresh is bookkeeping, not an event.
      - name: Slack post (daily digest or incident; no-op if webhook secret unset)
        if: steps.sig.outputs.publish == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not set — skipping Slack post."
            exit 0
          fi
          # check.mjs writes slack_payload.json (Block Kit) whenever it publishes.
          # status.md is markdown and Slack renders no tables, so it is not posted raw.
          if [ ! -f slack_payload.json ]; then
            echo "no slack_payload.json — nothing to post."
            exit 0
          fi
          code=$(curl -sS -o /tmp/slack.out -w '%{http_code}' -X POST \
            -H 'Content-type: application/json' --data @slack_payload.json "$SLACK_WEBHOOK_URL")
          echo "slack responded $code: $(cat /tmp/slack.out)"
          [ "$code" = "200" ] || { echo "Slack post failed"; exit 1; }
