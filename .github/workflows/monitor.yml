name: LP range monitor

on:
  schedule:
    - cron: "0 * * * *"   # top of every hour (UTC). GitHub may delay runs under load.
  workflow_dispatch: {}    # allows manual "Run workflow"

permissions:
  contents: write          # needed to commit status.md/state.json back

concurrency:
  group: lp-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - name: Run out-of-range check
        run: node check.mjs

      - name: Commit status only when the out-of-range set changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status.md state.json alerts.log
          if git diff --cached --quiet -- state.json; then
            echo "No range change this run — leaving repo untouched."
          else
            git commit -m "LP range change $(date -u +%FT%TZ) [skip ci]"
            git push
          fi
