name: LP range monitor

on:
  # Scheduling is outsourced to cron-job.org, which POSTs to the
  # workflow_dispatch API hourly. GitHub's own `schedule:` trigger is
  # deliberately absent: it is delayed under load and auto-disabled after
  # 60 days of repo inactivity.
  workflow_dispatch: {}    # external trigger + manual "Run workflow"

permissions:
  contents: write          # needed to commit status.md/state.json back

concurrency:
  group: lp-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - name: Run out-of-range check
        run: node check.mjs

      - name: Detect whether the out-of-range set changed (a flip)
        id: diff
        run: |
          git add status.md state.json alerts.log
          if git diff --cached --quiet -- state.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No range change this run."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Range change detected."
          fi

      - name: Commit status back (only on a flip)
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "LP range change $(date -u +%FT%TZ) [skip ci]"
          git push

      - name: Slack alert (only on a flip; no-op if webhook secret unset)
        if: steps.diff.outputs.changed == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not set — skipping Slack post."
            exit 0
          fi
          payload=$(node -e "const fs=require('fs');process.stdout.write(JSON.stringify({text:'*Celo LP alert*\n\n'+fs.readFileSync('status.md','utf8')}))")
          curl -sS -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
