name: LP range monitor

on:
  # Scheduling is outsourced to cron-job.org, which POSTs to the
  # workflow_dispatch API hourly. GitHub's own `schedule:` trigger is
  # deliberately absent: it is delayed under load and auto-disabled after
  # 60 days of repo inactivity.
  workflow_dispatch: {}    # external trigger + manual "Run workflow"

permissions:
  contents: write          # needed to commit status.md/state.json back

concurrency:
  group: lp-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      # Self-throttled: only calls Dune when pools_allowlist.json is >20h old,
      # and no-ops entirely if DUNE_API_KEY is unset (keeps the existing file).
      - name: Refresh TVL allowlist (daily, via Dune)
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          DUNE_TVL_THRESHOLD: "100"
        run: node refresh_allowlist.mjs

      # Pool-wide health (Dexscreener). Never fails the job; check.mjs reads its
      # output if present and simply omits the section if it is not.
      - name: Pool health check
        run: node pool_health.mjs

      - name: Run out-of-range check
        run: node check.mjs

      - name: Detect changes (range flip and/or allowlist refresh)
        id: diff
        run: |
          # tvl_history.json does not exist until the first pool-health run, and a
          # missing pathspec would fail this step and with it the whole monitor.
          for f in status.md state.json alerts.log pools_allowlist.json tvl_history.json; do
            [ -f "$f" ] || continue
            git add "$f"
          done
          range=false; allow=false; hist=false
          git diff --cached --quiet -- state.json || range=true
          git diff --cached --quiet -- pools_allowlist.json || allow=true
          git diff --cached --quiet -- tvl_history.json || hist=true
          echo "range=$range" >> "$GITHUB_OUTPUT"
          echo "allow=$allow" >> "$GITHUB_OUTPUT"
          echo "hist=$hist" >> "$GITHUB_OUTPUT"
          echo "flag change: $range | allowlist changed: $allow | daily TVL sample: $hist"

      - name: Commit back (on flag change, allowlist refresh or daily TVL sample)
        if: steps.diff.outputs.range == 'true' || steps.diff.outputs.allow == 'true' || steps.diff.outputs.hist == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          msg=""
          [ "${{ steps.diff.outputs.range }}" = "true" ] && msg="LP range change"
          [ "${{ steps.diff.outputs.allow }}" = "true" ] && msg="${msg:+$msg + }allowlist refresh"
          [ "${{ steps.diff.outputs.hist }}" = "true" ] && msg="${msg:+$msg + }daily TVL sample"
          git commit -m "${msg:-status update} $(date -u +%FT%TZ) [skip ci]"
          git push

      # Only flag changes ping Slack. A daily TVL sample or an allowlist refresh
      # is bookkeeping, not an event.
      - name: Slack alert (only on a flag change; no-op if webhook secret unset)
        if: steps.diff.outputs.range == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not set — skipping Slack post."
            exit 0
          fi
          payload=$(node -e "const fs=require('fs');process.stdout.write(JSON.stringify({text:'*Celo LP alert*\n\n'+fs.readFileSync('status.md','utf8')}))")
          curl -sS -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
